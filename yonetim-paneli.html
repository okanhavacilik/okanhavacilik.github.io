<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OHT Yönetim Paneli</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f3f7fa;
      background:
        radial-gradient(circle at top right, #0c315d, transparent 40%),
        #07182d;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 5%;
      border-bottom: 1px solid rgba(114, 210, 244, 0.2);
      background: rgba(7, 24, 45, 0.92);
    }

    .panel-header h1 {
      font-size: 24px;
    }

    .panel-header p {
      margin-top: 6px;
      color: #72d2f4;
      font-size: 14px;
    }

    .logout-button {
      border: 1px solid #72d2f4;
      border-radius: 10px;
      padding: 10px 16px;
      color: #f3f7fa;
      background: transparent;
      cursor: pointer;
    }

    .panel-main {
      width: min(1200px, 92%);
      margin: 35px auto;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .summary-card {
      padding: 20px;
      border: 1px solid rgba(114, 210, 244, 0.25);
      border-radius: 14px;
      background: rgba(12, 49, 93, 0.48);
    }

    .summary-card span {
      display: block;
      margin-bottom: 8px;
      color: #b9d9e7;
      font-size: 14px;
    }

    .summary-card strong {
      color: #72d2f4;
      font-size: 28px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .filter-button {
      border: 1px solid rgba(114, 210, 244, 0.5);
      border-radius: 20px;
      padding: 9px 15px;
      color: #f3f7fa;
      background: transparent;
      cursor: pointer;
    }

    .filter-button.active {
      color: #07182d;
      background: #72d2f4;
    }

    .application-list {
      display: grid;
      gap: 18px;
    }

    .application-card {
      padding: 22px;
      border: 1px solid rgba(114, 210, 244, 0.22);
      border-radius: 16px;
      background: rgba(23, 34, 49, 0.92);
    }

    .application-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .application-top h2 {
      margin-bottom: 6px;
      font-size: 20px;
    }

    .application-type {
      color: #72d2f4;
      font-size: 14px;
    }

    .status {
      border-radius: 20px;
      padding: 7px 12px;
      font-size: 13px;
      white-space: nowrap;
    }

    .status-beklemede {
      color: #ffd166;
      background: rgba(255, 209, 102, 0.15);
    }

    .status-inceleniyor {
      color: #72d2f4;
      background: rgba(114, 210, 244, 0.15);
    }

    .status-onaylandi {
      color: #72f4a1;
      background: rgba(114, 244, 161, 0.15);
    }

    .status-reddedildi {
      color: #ff8d8d;
      background: rgba(255, 91, 91, 0.15);
    }

    .applicant-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .info-item {
      padding: 11px;
      border-radius: 9px;
      background: rgba(7, 24, 45, 0.65);
    }

    .info-item small {
      display: block;
      margin-bottom: 5px;
      color: #93afbf;
    }

    .answers {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(114, 210, 244, 0.18);
    }

    .answer-item {
      margin-top: 12px;
      padding: 12px;
      border-left: 3px solid #43b8e8;
      background: rgba(7, 24, 45, 0.55);
    }

    .answer-item strong {
      display: block;
      margin-bottom: 7px;
      color: #72d2f4;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 20px;
    }

    .status-button {
      border: 0;
      border-radius: 8px;
      padding: 9px 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .review-button {
      color: #07182d;
      background: #72d2f4;
    }

    .approve-button {
      color: #07182d;
      background: #72f4a1;
    }

    .reject-button {
      color: white;
      background: #a8324a;
    }

    .empty-message {
      padding: 40px;
      border: 1px dashed rgba(114, 210, 244, 0.35);
      border-radius: 14px;
      color: #b9d9e7;
      text-align: center;
    }

    @media (max-width: 750px) {
      .summary-cards,
      .applicant-info {
        grid-template-columns: 1fr;
      }

      .panel-header,
      .application-top {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header class="panel-header">
    <div>
      <h1>OHT Yönetim Paneli</h1>
      <p>Üyelik ve ekip başvuruları</p>
    </div>

    <button type="button" class="logout-button" id="logout-button">
      Güvenli Çıkış
    </button>
  </header>

  <main class="panel-main">

    <section class="summary-cards">
      <div class="summary-card">
        <span>Tüm Başvurular</span>
        <strong id="total-count">0</strong>
      </div>

      <div class="summary-card">
        <span>Bekleyenler</span>
        <strong id="pending-count">0</strong>
      </div>

      <div class="summary-card">
        <span>İncelenenler</span>
        <strong id="review-count">0</strong>
      </div>

      <div class="summary-card">
        <span>Onaylananlar</span>
        <strong id="approved-count">0</strong>
      </div>
    </section>

    <section class="filters">
      <button class="filter-button active" data-status="tumu">
        Tümü
      </button>

      <button class="filter-button" data-status="beklemede">
        Onaylanmamış
      </button>

      <button class="filter-button" data-status="inceleniyor">
        İncelenenler
      </button>

      <button class="filter-button" data-status="onaylandi">
        Onaylananlar
      </button>

      <button class="filter-button" data-status="reddedildi">
        Reddedilenler
      </button>
    </section>

    <section class="application-list" id="application-list">
      <p class="empty-message">Başvurular yükleniyor...</p>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="yonetim-paneli.js"></script>

</body>
</html>
