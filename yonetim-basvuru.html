<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Topluluk Başvurusu | Okan Havacılık Topluluğu</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      color: #f3f7fa;
      background:
        radial-gradient(circle at top right, #0c315d, transparent 45%),
        #07182d;
    }

    .form-container {
      width: min(760px, 100%);
      margin: auto;
      padding: 35px;
      border: 1px solid rgba(114, 210, 244, 0.3);
      border-radius: 18px;
      background: rgba(12, 49, 93, 0.75);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 28px;
      color: #72d2f4;
      text-decoration: none;
    }

    .form-header {
      margin-bottom: 30px;
    }

    .form-header span {
      color: #72d2f4;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .form-header h1 {
      margin: 10px 0;
      font-size: clamp(30px, 6vw, 48px);
    }

    .form-header p {
      color: #b8cddd;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      color: #f3f7fa;
      border: 1px solid rgba(114, 210, 244, 0.45);
      border-radius: 8px;
      outline: none;
      background: #07182d;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #72d2f4;
      box-shadow: 0 0 0 3px rgba(114, 210, 244, 0.12);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .consent-group {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 8px;
    }

    .consent-group input {
      width: auto;
      margin-top: 4px;
    }

    .consent-group label {
      color: #c9d8e3;
      font-size: 14px;
      font-weight: normal;
      line-height: 1.5;
    }

    .submit-button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      color: #07182d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      background: #72d2f4;
    }

    .submit-button:hover {
      background: #43b8e8;
    }

    .submit-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #form-message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      text-align: center;
      border-radius: 8px;
    }

    @media (max-width: 650px) {
      .form-container {
        padding: 24px 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full-width {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <main class="form-container">
    <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>

    <header class="form-header">
      <span>ARAMIZA KATIL</span>
      <h1>Yönetim Kurulu Başvuru Formu </h1>

      <p>
  Okan Havacılık Topluluğunun çalışmalarında aktif sorumluluk almak,
  fikirlerini projelere dönüştürmek ve yönetim ekibimizin bir parçası
  olmak isteyen öğrencilerin başvurularını bekliyoruz.
</p>

    </header>

    <form id="application-form" data-application-type="yonetim">
      <div class="form-grid">

        <div class="form-group">
          <label for="full-name">Ad Soyad *</label>

          <input
            id="full-name"
            name="full_name"
            type="text"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="student-number">Öğrenci Numarası *</label>

          <input
            id="student-number"
            name="student_number"
            type="text"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">E-posta Adresi *</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          >
        </div>

       <div class="form-group">
  <label for="phone">
    Telefon Numarası
    <span style="font-size: 12px; font-weight: normal;">
      (Lütfen 0 ile başlayarak giriniz.)
    </span>
  </label>

  <input
    type="tel"
    id="phone"
    name="phone"
    placeholder="05XX XXX XX XX"
    pattern="0[0-9]{10}"
    maxlength="11"
    inputmode="numeric"
  >
</div>

        <div class="form-group">
          <label for="department">Bölüm *</label>

          <input
            id="department"
            name="department"
            type="text"
            required
          >
        </div>

        <div class="form-group">
          <label for="class-level">Sınıf *</label>

          <select id="class-level" name="class_level" required>
            <option value="">Seçiniz</option>
            <option value="Hazırlık">Hazırlık</option>
            <option value="1. Sınıf">1. Sınıf</option>
            <option value="2. Sınıf">2. Sınıf</option>
            <option value="3. Sınıf">3. Sınıf</option>
            <option value="4. Sınıf">4. Sınıf</option>
            <option value="Mezun">Mezun</option>
          </select>
        </div>

        <div class="form-group full-width">
  <label for="question_1">
    1. Okan Havacılık Topluluğu’nda yalnızca üye olmak yerine neden yönetim kurulunda görev almak istiyorsun? *
  </label>
  <textarea
    id="question_1"
    name="question_1"
    required
  ></textarea>
</div>

<div class="form-group full-width">
  <label for="question_2">
    2. Havacılık senin için ne ifade ediyor? Bu alana ilgini gösteren somut bir örnek verebilir misin? *
  </label>
  <textarea
    id="question_2"
    name="question_2"
    required
  ></textarea>
</div>

<div class="form-group full-width">
  <label for="question_3">
    3. OHT’ye hangi alanlarda katkı sağlayabilirsin? Bu alanlardaki deneyimlerinden ve kullanılabilecek özel yetkinliklerinden söz eder misin? *
  </label>
  <textarea
    id="question_3"
    name="question_3"
    required
  ></textarea>
</div>

<div class="form-group full-width">
  <label for="question_4">
    4. Yönetim kuruluna kabul edildiğini ancak senden henüz bir görev istenmediğini düşün. Kendi isteğinle başlatacağın ilk çalışma ne olurdu? *
  </label>
  <textarea
    id="question_4"
    name="question_4"
    required
  ></textarea>
</div>

<div class="form-group full-width">
  <label for="question_5">
    5. Bir yılın sonunda “Bu topluluğa gerçekten katkı sağladım.” diyebilmek için neyi başarmış olmak isterdin? OHT’nin hangi çalışmasını nasıl geliştirirdin? *
  </label>
  <textarea
    id="question_5"
    name="question_5"
    required
  ></textarea>
</div>

<div class="form-group full-width">
  <label for="question_6">
    6. Hiçbir bütçen olmadan OHT’nin üniversite içerisindeki görünürlüğünü artırmak için nasıl bir çalışma yapardın? *
  </label>
  <textarea
    id="question_6"
    name="question_6"
    required
  ></textarea>
</div>

<div class="form-group full-width">
  <label for="question_7">
    7. Bir etkinliğe iki gün kala bazı görevlerin tamamlanmadığını fark ettin. Üstelik sana verilen görevlerden birinin de zamanında yetişmeyeceğini düşünüyorsun. Böyle bir durumda nasıl hareket edersin? *
  </label>
  <textarea
    id="question_7"
    name="question_7"
    required
  ></textarea>
</div>

<div class="form-group full-width">
  <label for="question_8">
    8. Bir ekip arkadaşının yaptığı işi yeterli bulmadığında bunu nasıl ifade edersin? Çok istediğin bir fikir ekip tarafından kabul edilmezse nasıl davranırsın? *
  </label>
  <textarea
    id="question_8"
    name="question_8"
    required
  ></textarea>
</div>

<div class="form-group full-width">
  <label for="question_9">
    9. Topluluğa haftalık gerçekçi olarak ne kadar zaman ayırabilirsin? Sınav dönemlerinde ve görünmeyen operasyonel görevlerde sorumluluklarını nasıl yönetirsin? *
  </label>
  <textarea
    id="question_9"
    name="question_9"
    required
  ></textarea>
</div>

<div class="form-group full-width">
  <label for="question_10">
    10. Bir yönetim kurulu üyesinde bulunması gereken üç özellik sence nedir? Bu özelliklerden hangilerine sahipsin ve neden yönetim kuruluna seni almalıyız? *
  </label>
  <textarea
    id="question_10"
    name="question_10"
    required
  ></textarea>
</div>

      <button id="submit-button" class="submit-button" type="submit">
        Başvuruyu Gönder
      </button>

      <p id="form-message" aria-live="polite"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
<script src="yonetim-basvuru.js"></script>
</body>
</html>
